<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Enxi Hong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; overflow: hidden; font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    .center-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(1.6rem, 4.5vw, 2.8rem);
      font-weight: 300;
      color: #111;
      letter-spacing: 0.06em;
      pointer-events: none;
      user-select: none;
      text-align: center;
      animation: fadein 1.2s ease;
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <p class="center-text">Welcome to the website of Enxi Hong.</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const COLORS = [
      '#FF6B6B','#4ECDC4','#45B7D1','#96CEB4',
      '#FFEAA7','#DDA0DD','#98D8C8','#F7DC6F',
      '#BB8FCE','#85C1E9','#F8A5C2','#78E8FA'
    ];

    let W, H;
    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function rand(a, b) { return a + Math.random() * (b - a); }

    class Bubble {
      constructor(special) {
        this.special = !!special;
        this.r  = this.special ? 34 : rand(18, 40);
        this.x  = rand(this.r, W - this.r);
        this.y  = rand(this.r, H - this.r);
        const spd   = this.special ? rand(1.0, 1.8) : rand(1.5, 3.2);
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd;
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.alpha = rand(0.55, 0.85);
        this.phase = Math.random() * Math.PI * 2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x - this.r < 0)  this.vx =  Math.abs(this.vx);
        if (this.x + this.r > W)  this.vx = -Math.abs(this.vx);
        if (this.y - this.r < 0)  this.vy =  Math.abs(this.vy);
        if (this.y + this.r > H)  this.vy = -Math.abs(this.vy);
        if (this.special) this.phase += 0.04;
      }

      currentR() {
        return this.special ? this.r + Math.sin(this.phase) * 3 : this.r;
      }

      draw() {
        const r = this.currentR();
        ctx.save();
        if (this.special) {
          ctx.globalAlpha = 0.72;
          ctx.shadowColor = '#c8901a';
          ctx.shadowBlur  = 5;
          const g = ctx.createRadialGradient(
            this.x - r * 0.25, this.y - r * 0.25, r * 0.05,
            this.x, this.y, r
          );
          g.addColorStop(0,   '#f5d88a');
          g.addColorStop(1,   '#c8901a');
          ctx.fillStyle = g;
        } else {
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle   = this.color;
        }
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      hit(px, py) {
        const r  = this.currentR();
        const dx = px - this.x, dy = py - this.y;
        return dx * dx + dy * dy <= r * r;
      }
    }

    const bubbles = [];
    for (let i = 0; i < 15; i++) bubbles.push(new Bubble(false));
    const golden = new Bubble(true);
    bubbles.push(golden);

    (function loop() {
      ctx.clearRect(0, 0, W, H);
      for (const b of bubbles) { b.update(); b.draw(); }
      requestAnimationFrame(loop);
    })();

    function handleTap(px, py) {
      if (golden.hit(px, py)) window.location.href = 'home.html';
    }

    canvas.addEventListener('click', e => handleTap(e.clientX, e.clientY));
    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      handleTap(t.clientX, t.clientY);
    }, { passive: false });

    canvas.addEventListener('mousemove', e => {
      canvas.style.cursor = golden.hit(e.clientX, e.clientY) ? 'pointer' : 'default';
    });
  </script>
</body>
</html>
