  function renderMd(md) {
    const blocks = md.trim().split(/\n\n+/);
    return blocks.map(block => {
      const t = block.trim();
      if (/^-{3,}$/.test(t)) return '<hr>';
      if (t.startsWith('```')) {
        const code = t.replace(/^```\w*\n?/, '').replace(/\n?```$/, '');
        const esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        return '<pre><code>' + esc + '</code></pre>';
      }
      if (t.startsWith('### ')) return '<h3>' + inl(t.slice(4)) + '</h3>';
      if (t.startsWith('## ')) return '<h2>' + inl(t.slice(3)) + '</h2>';
      const lines = t.split('\n');
      if (lines.every(l => l.trim().startsWith('- '))) {
        return '<ul>' + lines.map(l => '<li>' + inl(l.trim().slice(2)) + '</li>').join('') + '</ul>';
      }
      if (lines.every(l => /^\d+\. /.test(l.trim()))) {
        return '<ol>' + lines.map(l => '<li>' + inl(l.trim().replace(/^\d+\. /, '')) + '</li>').join('') + '</ol>';
      }
      if (lines.every(l => l.trim().startsWith('|'))) {
        const rows = lines.filter(l => !/^\|[\s\-|]+$/.test(l.trim()));
        const [header, ...body] = rows;
        const cells = row => row.trim().replace(/^\||\|$/g, '').split('|').map(c => inl(c.trim()));
        const ths = cells(header).map(c => '<th>' + c + '</th>').join('');
        const trs = body.map(r => '<tr>' + cells(r).map(c => '<td>' + c + '</td>').join('') + '</tr>').join('');
        return '<table><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table>';
      }
      return '<p>' + inl(lines.join(' ')) + '</p>';
    }).join('');
  }

  function inl(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

## Das Konzept: Regression Discontinuity Design (RDD)

**RDD** nutzt eine künstliche Schwelle — eine Fördergrenze, eine Prüfungsnote, ein Geburtsdatum — als natürliches Experiment. Die Grundidee: Einheiten, die knapp ober- oder unterhalb dieser Grenze liegen, sind im Durchschnitt nahezu identisch. Wer beispielsweise mit 59 Punkten nicht gefördert wird, ist kaum anders als jemand mit 61 Punkten, der Förderung erhält.

Dieser scharfe Sprung in der Behandlung bei kontinuierlichen Hintergrundmerkmalen erlaubt einen kausalen Schluss: Ein beobachteter Sprung im Ergebnis direkt an der Schwelle kann kausal auf die Intervention zurückgeführt werden — nicht auf vorher bestehende Unterschiede.

**Zwei Varianten:**

- **Sharp RDD**: Alle, die die Schwelle überschreiten, erhalten die Behandlung — wie im Fall von Umberto und Enzo.
- **Fuzzy RDD**: Die Wahrscheinlichkeit der Behandlung steigt an der Schwelle stark an, aber nicht auf 100 % (z. B. weil manche Berechtigten das Angebot ablehnen). Hier verwendet man die Schwelle als Instrument.

**Die entscheidende Annahme**: Individuen können ihre Zugehörigkeit zur behandelten Gruppe nicht gezielt manipulieren. Wenn Winzer ihre Grundstücke nicht verschieben können, ist die Zuteilung nahe der Grenze quasi-zufällig — und damit glaubwürdig exogen.

RDD ist besonders wertvoll, weil er kausal argumentiert, ohne eine randomisierte Studie zu erfordern. Er nutzt, was die Welt ohnehin produziert: willkürliche Grenzen. Und macht daraus Wissen.`

## Das Konzept: Instrumental Variable (IV)

Was Mira in der Geschichte intuitiv entdeckt, ist eine der elegantesten Methoden der Kausalinferenz: die **Instrumentalvariable** (*Instrumental Variable, IV*).

### Das Grundproblem: Konfundierung

Wenn wir beobachten, dass Patienten mit häufigen Kontrolluntersuchungen länger leben, können wir nicht einfach schlussfolgern, dass die Untersuchungen die Ursache sind. Es gibt **nicht gemessene, gemeinsame Ursachen** (Confounder) — etwa die allgemeine Disziplin oder das soziale Umfeld einer Person —, die sowohl die Besuchshäufigkeit als auch das Überleben beeinflussen. Klassische Regressionen oder Matching-Verfahren können diese **unbeobachteten Confounder** nicht beseitigen.

### Die Lösung: Ein Instrument

Eine Instrumentalvariable *Z* ist eine Variable, die drei Bedingungen erfüllt:

| Bedingung | Bedeutung | Im Beispiel |
|---|---|---|
| **Relevanz** | Z beeinflusst die Behandlung X | Die Baustelle reduziert tatsächlich die Besuchshäufigkeit |
| **Exogenität** | Z ist unabhängig von den Confoundern | Die Straßensperrung hat nichts mit der Gesundheitsmotivation der Patienten zu tun |
| **Ausschlussbeschränkung** | Z beeinflusst das Outcome Y *nur* durch X | Die Baustelle beeinflusst das Überleben *ausschließlich* über weniger Arztbesuche — nicht direkt |

Die Baustelle erfüllt alle drei: Sie ist zufällig entstanden, von den Patienteneigenschaften unabhängig, und hat keinen direkten Einfluss auf das Herz — nur auf die Terminhäufigkeit.

### Die Schätzung: Two-Stage Least Squares (2SLS)

In der Praxis verwendet man häufig das **Zwei-Stufen-Verfahren**:

1. **Erste Stufe:** Schätze die Behandlung X (Besuchshäufigkeit) als Funktion des Instruments Z (Baustelle ja/nein) — extrahiere so den „exogenen", zufälligen Teil der Variation in X.
2. **Zweite Stufe:** Schätze den Effekt dieser bereinigten Behandlung auf das Outcome Y (Überleben).

Weil in Stufe 1 alle patientenseitigen Einflüsse herausgefiltert wurden, ist der in Stufe 2 geschätzte Koeffizient kausal interpretierbar — zumindest für jene Patienten, deren Verhalten das Instrument tatsächlich verändert hat.

### Was IV schätzt: LATE

Ein wichtiger Punkt für Master-Niveau: IV schätzt nicht den durchschnittlichen Behandlungseffekt für alle (*ATE*), sondern den **Local Average Treatment Effect (LATE)** — den Effekt für die sogenannten **Compliers**, also jene Patienten, die wegen der Baustelle tatsächlich seltener kamen und ihr Verhalten geändert hätten. Patienten, die so oder so kämen (Always-Takers) oder nie kämen (Never-Takers), fließen nicht in die Schätzung ein.

### Warum ist das mächtig?

IV erlaubt kausale Schätzung **ohne randomisiertes Experiment** — indem natürliche oder institutionelle Zufälle (*natural experiments*) genutzt werden. Klassische Beispiele in der Forschung sind: Geburtsmonat als Instrument für Bildungsjahre, Kriegslotterie als Instrument für Militärdienst, oder Entfernung zum nächsten Krankenhaus als Instrument für Behandlungsintensität.

Die Methode zeigt: Manchmal steckt die größte Erkenntnis nicht im sorgfältig geplanten Experiment — sondern in der Baustelle, die jemand vergessen hat zu melden.`

## Das Konzept: Agentenevaluation

**Was ist ein Evaluation Harness?**

In der KI-Forschung – besonders beim Testen von autonomen Agenten (z. B. LLM-basierten Systemen) – ist ein *Evaluation Harness* eine kontrollierte Testumgebung, die einen Agenten systematisch und reproduzierbar bewertet. Genau wie Teodors Prüferin stellt sie immer dieselben Bedingungen her, unabhängig vom Tester.

**Isolation & Reproduzierbarkeit** — Der Agent wird in einer definierten Umgebung ausgeführt. Externe Variablen (Netzwerk, Zufall, Kontext) werden kontrolliert oder fixiert, damit zwei Läufe vergleichbar sind.

**Aufgaben-Design (Task Suite)** — Das Harness enthält eine kuratierte Menge von Aufgaben, die verschiedene Fähigkeiten abdecken: Reasoning, Tool-Use, Fehlerkorrektur, Mehrschrittigkeit. Wie Teodors verschiedene Prüferinnen für Kälte oder Stoß.

**Metriken vs. Proxy-Metriken** — Ein zentrales Problem: Was gemessen wird, ist oft nicht das, was eigentlich zählt. Ein Agent kann einen Benchmark „bestehen" und im echten Einsatz scheitern – genau wie Teodors Uhren, die in der Prüferin gut liefen, draußen aber versagten. Forscher nennen das *Goodhart's Law* oder *Benchmark Overfitting*.

**Blind Evaluation & Bias-Kontrolle** — Das Harness urteilt mechanisch, nicht subjektiv. Dadurch werden menschliche Erwartungen, Reihenfolge-Effekte und Confirmation Bias eliminiert.

**Die offene Frage** — Kein Harness ist vollständig. Die eigentliche Kunst liegt darin, Aufgaben zu entwerfen, die *valide* sind: die das messen, was im echten Einsatz relevant ist — und nicht nur das, was leicht zu messen ist.`

## Das Konzept: Window Functions in SQL

**Window Functions** (analytische Funktionen) berechnen Werte über eine Menge von Zeilen — das sogenannte *Fenster* — ohne die zugrundeliegende Tabelle zu aggregieren oder Zeilen zu entfernen.

Im Gegensatz zu \`GROUP BY\`, das Zeilen zu einer einzigen Ergebniszeile zusammenfasst, bleibt bei Window Functions jede Zeile erhalten. Der berechnete Wert bezieht sich jedoch auf den definierten Rahmen (Partition + Sortierung + Frame).

**Grundstruktur:**

\`\`\`sql
SELECT
  name,

## Das Konzept: Leitungssatz-Topologie und Lastpfadanalyse

Im **Harness Engineering** bezeichnet die **Topologie** eines Kabelbaums die strukturelle Anordnung aller elektrischen Verbindungen: Wer ist mit wem verbunden? Über welche Wege fließt Strom? Wo gibt es Verteilerknoten (Splices, Connector Hubs), und welche Leitungen tragen wie viel Last?

Die **Lastpfadanalyse** geht einen Schritt weiter: Sie untersucht, welche Konsequenzen entstehen, wenn ein Pfad ausfällt – durch Leitungsbruch, Steckerfehler oder Überlast. Kritische Fragen sind dabei:

- **Propagation**: Führt ein lokaler Fehler zu einem systemweiten Ausfall?
- **Redundanz**: Gibt es alternative Strompfade (parallele Leitungen, Bypass-Routen)?
- **Derating**: Ist jede Leitung für die tatsächlich fließende Last ausgelegt – inklusive aller Lastfälle und Toleranzen?

Im Fahrzeug- und Luftfahrtbereich ist diese Analyse sicherheitskritisch: Ein falsch dimensionierter Splice, der mehrere Verbraucher versorgt, kann bei Überlast thermisch versagen und kaskadenartige Ausfälle auslösen – genau wie Luisas fehlender Oboist, der über mehrere Zwischenglieder das gesamte Orchester destabilisierte.

In einer Stadt lebte eine Frau namens Vera, die als Archivarin arbeitete. Ihr Archiv war kein gewöhnliches — es enthielt keine Bücher, sondern **Mengen**: Körbe voller Dinge, Schachteln in Schachteln, Zimmer voller Zimmer.

Vera betrachtete den Korb. Er war leer, aber das störte sie nicht. Seltsam war etwas anderes.

„Enthält dein Korb sich selbst?", fragte sie ruhig.

Der junge Mann lachte. „Natürlich nicht. Also gehört er zu den Körben, die sich nicht selbst enthalten — und deshalb *ist* er ja auch darin."

Vera schwieg.

„Aber warte", fuhr er fort, langsamer jetzt. „Wenn er *in sich selbst* ist… dann enthält er sich selbst. Und dann dürfte er gar nicht darin sein. Dann müsste er *heraus*." Er griff in den Korb, zog ihn heraus — und hielt ihn in der Hand. „Aber jetzt enthält er sich wieder nicht, also *muss* er hinein."

Er legte ihn wieder hinein.

Heraus. Hinein. Heraus. Hinein.

Der junge Mann sah Vera an. Sie lächelte nicht, aber ihre Augen waren wach.

„Was ist das?", flüsterte er.

„Ein Widerspruch", sagte sie. „Aber kein gewöhnlicher. Dein Korb ist nicht falsch gebaut — die *Frage* ist falsch gestellt. Du hast eine Menge erschaffen, die sich selbst definieren soll, ob sie sich enthält. Und das kann sie nicht. Sie zerfällt in dem Moment, in dem sie es versucht."

Der junge Mann setzte sich. Lange sagte er nichts.

„Dann kann man nicht einfach *alle* Mengen sammeln?"

„Nein", antwortete Vera. „Manche Sammlungen darf man nicht bilden. Nicht weil es verboten ist — sondern weil die Logik selbst zusammenbricht."

## Das Konzept: Russells Paradoxon

**Bertrand Russell** entdeckte 1901 einen fundamentalen Widerspruch in der naiven Mengenlehre.

Die **naive Mengenlehre** erlaubte jede beliebige Eigenschaft, um eine Menge zu definieren — also auch: *„Die Menge aller Mengen, die sich nicht selbst enthalten"*, formal: **R = { x | x ∉ x }**.

Die Frage lautet dann: Gilt R ∈ R?

- Wenn **R ∈ R**, dann erfüllt R die definierende Eigenschaft nicht — also müsste R ∉ R gelten. Widerspruch.
- Wenn **R ∉ R**, dann erfüllt R die Eigenschaft — also müsste R ∈ R gelten. Widerspruch.

Das Paradoxon zeigte, dass die naive Mengenlehre (Freges System) in sich **inkonsistent** ist. Es war kein Randproblem — es traf das Fundament der Mathematik.

Die Reaktion war tiefgreifend: Ernst Zermelo und Abraham Fraenkel entwickelten die **axiomatische Mengenlehre (ZF/ZFC)**, die das unkontrollierte Bilden von Mengen einschränkt. Das **Aussonderungsaxiom** erlaubt nur noch, Teilmengen aus bereits existierenden Mengen auszusondern — eine „Menge aller Mengen" darf gar nicht erst entstehen.

Russells Paradoxon markiert damit den Übergang von der intuitiven zur streng axiomatischen Mathematik — eine der wichtigsten Zäsuren des 20. Jahrhunderts.`
